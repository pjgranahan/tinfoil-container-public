cvm-version: 0.14.7
cpus: 2
memory: 8192

networks:
  egress:
    egress: allowlist
    allow:
      - inference.tinfoil.sh
      - atc.tinfoil.sh
      - tuf-repo-cdn.sigstore.dev

volumes:
  - name: state
    owner: 10001
    exec: true

containers:
  - name: "app"
    image: "ghcr.io/pjgranahan/app-public@sha256:93795d80c8a91ce399815652bef54253d2063cbf98dedc20514d651177aa4514"
    networks: [egress]
    volumes: [state:/data]
    env:
      - STATE_BACKEND: "volume"
      - PAC_VOLUME_NAME: "state"
    secrets:
      - TINFOIL_API_KEY
      - JOB_API_TOKEN
      - DASHBOARD_PASSWORD_HASH
    tmpfs:
      /tmp: "size=1g,uid=10001,gid=10001,mode=1777"
    stop_signal: SIGTERM
    stop_timeout: 60
    restart: on-failure

shim:
  upstream-port: 8080
  paths:
    - /healthz
    - /v1/volume/unlock
    - /login
    - /auth/*
    - /api/*

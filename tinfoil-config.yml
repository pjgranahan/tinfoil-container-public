cvm-version: 0.14.7
cpus: 2
memory: 8192

networks:
  egress:
    egress: allowlist
    allow:
      - inference.tinfoil.sh
      - atc.tinfoil.sh
      - tuf-repo-cdn.sigstore.dev

volumes:
  - name: state
    owner: 10001
    exec: true

containers:
  - name: "app"
    image: "ghcr.io/pjgranahan/app-public@sha256:a5fa127569ef361ca6c758c2fe491244e85b1e69cec019cccb0e0a57a7e2a792"
    networks: [egress]
    volumes: [state:/data]
    env:
      - STATE_BACKEND: "volume"
      - PAC_VOLUME_NAME: "state"
    secrets:
      - TINFOIL_API_KEY
      - JOB_API_TOKEN
    tmpfs:
      /tmp: "size=1g,uid=10001,gid=10001,mode=1777"
    stop_signal: SIGTERM
    stop_timeout: 60
    restart: on-failure

shim:
  upstream-port: 8080
  paths:
    - /healthz
    - /v1/jobs/*
    - /v1/volume/unlock
